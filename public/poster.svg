<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Orbit Voyages poster: shown before the 3D is ready and whenever WebGL is unavailable. Drawn by hand in SVG. -->
  <defs>
    <radialGradient id="sky" cx="0.7" cy="0.45" r="0.9">
      <stop offset="0" stop-color="#0d1226"/>
      <stop offset="0.6" stop-color="#05070f"/>
      <stop offset="1" stop-color="#04050a"/>
    </radialGradient>
    <radialGradient id="earth" cx="0.82" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#bfe4ff"/>
      <stop offset="0.14" stop-color="#3f86cf"/>
      <stop offset="0.34" stop-color="#103463"/>
      <stop offset="0.55" stop-color="#050b19"/>
      <stop offset="1" stop-color="#03050b"/>
    </radialGradient>
    <radialGradient id="atm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.86" stop-color="#4f9bff" stop-opacity="0"/>
      <stop offset="0.93" stop-color="#5aa6ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5aa6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mars" cx="0.72" cy="0.34" r="0.8">
      <stop offset="0" stop-color="#ffb48a"/>
      <stop offset="0.3" stop-color="#d9622f"/>
      <stop offset="0.6" stop-color="#6e250d"/>
      <stop offset="1" stop-color="#140602"/>
    </radialGradient>
    <radialGradient id="band" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2a2c4a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2a2c4a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stars" width="240" height="240" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="30" r="1" fill="#fff" opacity="0.7"/>
      <circle cx="96" cy="12" r="0.8" fill="#cfe0ff" opacity="0.6"/>
      <circle cx="170" cy="64" r="1.3" fill="#fff" opacity="0.8"/>
      <circle cx="60" cy="120" r="0.7" fill="#ffe2c4" opacity="0.55"/>
      <circle cx="210" cy="150" r="0.9" fill="#fff" opacity="0.6"/>
      <circle cx="132" cy="196" r="1.1" fill="#cfe0ff" opacity="0.7"/>
      <circle cx="30" cy="214" r="0.8" fill="#fff" opacity="0.5"/>
      <circle cx="150" cy="110" r="0.6" fill="#fff" opacity="0.45"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <ellipse cx="900" cy="420" rx="900" ry="160" fill="url(#band)" transform="rotate(-18 900 420)"/>
  <rect width="1600" height="1000" fill="url(#stars)"/>
  <!-- trajectory arc -->
  <path d="M 1010 760 C 1150 420, 1300 300, 1430 230" fill="none" stroke="#7fd4ff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 10"/>
  <!-- Earth crescent -->
  <circle cx="1080" cy="760" r="330" fill="url(#atm)"/>
  <circle cx="1080" cy="760" r="300" fill="url(#earth)"/>
  <!-- Mars -->
  <circle cx="1440" cy="220" r="74" fill="#ff7a45" opacity="0.12"/>
  <circle cx="1440" cy="220" r="58" fill="url(#mars)"/>
  <!-- sun glint -->
  <circle cx="1350" cy="640" r="3" fill="#fff6e8"/>
  <circle cx="1350" cy="640" r="40" fill="#fff0d8" opacity="0.08"/>
</svg>
